spring:
  application:
    name: delivery
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=public
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true
    default-schema: public

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public

app:
  grpc:
    geo-service:
      host: ${GEO_SERVICE_GRPC_HOST}
      port: ${GEO_SERVICE_GRPC_PORT}